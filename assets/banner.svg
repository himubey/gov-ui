<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 320" width="1200" height="320" role="img" aria-label="GOV UI — lightweight UI for government software">
  <title>GOV UI</title>
  <desc>Wordmark for GOV UI, an independent open-source design system for public-sector software. Deliberately carries no state emblem, seal or crown.</desc>

  <!--
    Every colour here is a GOV UI token, so the banner is made of the
    design system it advertises. Token names are written without their
    leading dashes because a double hyphen is not legal inside an XML
    comment, and an SVG that is not well-formed is silently rejected by
    strict consumers such as GitHub.

      #0b2a55  gov-primary        #ffdd00  gov-focus
      #15803d  gov-success        #b45309  gov-warning
      #b91c1c  gov-danger         #0369a1  gov-info
  -->

  <rect width="1200" height="320" fill="#0b2a55"/>

  <!-- The focus ring's yellow, used as a rule. The one bright colour in
       the system, and the one that has to be seen. -->
  <rect x="80" y="96" width="6" height="128" fill="#ffdd00"/>

  <g font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Arial, sans-serif">
    <text x="122" y="163" fill="#ffffff" font-size="76" font-weight="700" letter-spacing="-1.5">GOV UI</text>
    <text x="126" y="205" fill="#ffffff" font-size="25" opacity="0.88">Lightweight UI for government software.</text>
    <text x="126" y="243" fill="#ffffff" font-size="17" opacity="0.62">Admin-first · Framework-independent · Zero dependencies · WCAG 2.2 AA</text>
  </g>

  <!-- Status palette, in the order the system defines it. -->
  <g>
    <rect x="1000" y="96" width="120" height="26" rx="3" fill="#15803d"/>
    <rect x="1000" y="130" width="120" height="26" rx="3" fill="#b45309"/>
    <rect x="1000" y="164" width="120" height="26" rx="3" fill="#b91c1c"/>
    <rect x="1000" y="198" width="120" height="26" rx="3" fill="#0369a1"/>
  </g>
</svg>
